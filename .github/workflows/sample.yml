name: Share Outputs Between Jobs

on:
  push:

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      my_output: ${{ steps.write_output.outputs.my_output }}
    steps:
      - name: Write to $GITHUB_OUTPUT
        id: write_output
        run: echo "my_output=value" >> $GITHUB_OUTPUT

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Use Output from job1
        run: echo "Output from job1:${{ needs.job1.outputs.my_output }}"
