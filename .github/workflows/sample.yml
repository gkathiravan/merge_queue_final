name: merge queue

on:
  pull_request:
     types: [opened, synchronize]
  push:
    branches:
      - develop
jobs:
  hello_world:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Print Hello World
      run: echo "Hello, World"
      
    - name: Get previous commit ID
      id: get-commit
      run: |
        if git show HEAD > /dev/null 2>&1; then
          echo "previous=$(git show HEAD~1)" >> $GITHUB_ENV
        else
          echo "previous=$(git show HEAD~1)" >> $GITHUB_ENV
        fi

    - name: Echo previous commit
      run: echo "This is previous ${{ env.previous }}"
