name: Dependency Check Workflow

on:
  pull_request: # Trigger this workflow on pull request events
    branches:
      - develop # Adjust this to the branch where you want the workflow to run

jobs:
  job-a:
    runs-on: ubuntu-latest
    steps:
      - name: Run Job A
        run: |
          echo "Running Job A"
          exit 1 # Simulate failure for testing

  job-c:
    runs-on: ubuntu-latest
    steps:
      - name: Run Job C
        run: |
          echo "Running Job C"
          exit 0 # Simulate success for testing

  job-d:
    runs-on: ubuntu-latest
    steps:
      - name: Run Job D
        run: |
          echo "Running Job D"
          exit 0 # Simulate success for testing

  job-b:
    runs-on: ubuntu-latest
    needs: [job-a, job-c, job-d]
    if: always() # Run Job B regardless of dependency results
    steps:
      - name: Check Dependency Results
        run: |
          if [ "${{ needs.job-a.result }}" != "success" ] || 
             [ "${{ needs.job-c.result }}" != "success" ] || 
             [ "${{ needs.job-d.result }}" != "success" ]; then
            echo "At least one dependency failed."
            exit 1
          fi

          echo "All dependencies succeeded. Job B succeeded."
